name: OHOS cross-build experiment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Prepare pinned tools
        run: |
          mkdir -p results/feasibility/setup
          {
            rust_version=$(jq -r .rust_version config/feasibility.json)
            target=$(jq -r .target config/feasibility.json)
            cargo_ohos_version=$(jq -r .cargo_ohos_version config/feasibility.json)
            rustup toolchain install "$rust_version" --profile minimal --target "$target"
            cargo install cargo-ohos --version "$cargo_ohos_version" --locked
            cargo build --locked --bin ohos-pulse
          } 2>&1 | tee results/feasibility/setup/tools.log
      - name: Install SDK release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          release=$(jq -r .sdk_release config/feasibility.json)
          cargo ohos init sdk --version "$release" --components native 2>&1 | tee results/feasibility/setup/sdk.log
      - name: Run Rust check and link
        run: target/debug/ohos-pulse run --output results/feasibility/build
      - name: Publish summary
        if: always()
        run: |
          if [ -f results/feasibility/build/summary.md ]; then
            cat results/feasibility/build/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'SDK/tool setup did not reach scenario execution. Inspect setup logs; runtime and integration were not run.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ohos-cross-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/feasibility/
          retention-days: 14
          if-no-files-found: warn
