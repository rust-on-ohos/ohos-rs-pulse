name: PR checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup show active-toolchain
      - name: Check CLI and fixture formatting
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path fixtures/libc-file-io/Cargo.toml -- --check
      - name: Lint CLI and fixture
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --all-targets --manifest-path fixtures/libc-file-io/Cargo.toml -- -D warnings
      - name: Test Rust orchestration and host fixture contract
        run: |
          cargo test --locked --all-targets
          cargo test --locked --manifest-path fixtures/libc-file-io/Cargo.toml
